<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
    <link rel="stylesheet" href="Dolphins.css">
</head>
<body>

<header>
    <h1>
        <img src="Images/dolphin128x128.png" alt="Dolphin Image">
        Dolphins Swim Academy
    </h1>
</header>

<h2>Register</h2>

<form>
    <label for="session">Session:</label>
    <select name="session" id="session">
        <option value="session1">Session 1: June 17 - June 27</option>
        <option value="session2">Session 2: July 8 - July 18</option>
        <option value="session3">Session 3: July 22 - August 1</option>
        <option value="session4">Session 4: August 5 - August 15</option>
    </select>

    <br>

    <label for="name">Name:</label>
    <input type="text" name="name" id="name">

    <br>

    <label for="birth-year">Birth Year:</label>
    <input type="text" name="birth-year" id="birth-year">

    <br>

    <label for="level">Level:</label>
    <select name="level" id="level">
        <option value="starfish">Starfish</option>
        <option value="minnows">Minnows</option>
        <option value="guppies">Guppies</option>
        <option value="dolphins">Dolphins</option>
    </select>

    <br>

    <label>Time (1st Choice):</label>

    <input type="radio" name="first-choice" id="first-9am" value="9am">
    <label for="first-9am">9am</label>

    <input type="radio" name="first-choice" id="first-10am" value="10am">
    <label for="first-10am">10am</label>

    <input type="radio" name="first-choice" id="first-1pm" value="1pm">
    <label for="first-1pm">1pm</label>

    <input type="radio" name="first-choice" id="first-2pm" value="2pm">
    <label for="first-2pm">2pm</label>

    <br>

    <label>Time (2nd Choice):</label>

    <input type="radio" name="second-choice" id="second-9am" value="9am">
    <label for="second-9am">9am</label>

    <input type="radio" name="second-choice" id="second-10am" value="10am">
    <label for="second-10am">10am</label>

    <input type="radio" name="second-choice" id="second-1pm" value="1pm">
    <label for="second-1pm">1pm</label>

    <input type="radio" name="second-choice" id="second-2pm" value="2pm">
    <label for="second-2pm">2pm</label>

    <br>

    <button type="submit">Register</button>
</form>

<footer>
    Copyright © Dolphins Swim Academy 2024
    <br>
    Dolphin icon is created by
    <a href="https://www.flaticon.com/authors/freepik">Freepik</a>
    from
    <a href="https://www.flaticon.com/">Flaticon</a>
</footer>

</body>
</html>
